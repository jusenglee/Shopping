
buildscript {
    ext {
        queryDslVersion = "5.1.0"
    }
}
plugins {
    id 'org.springframework.boot' version '3.1.2'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}


group = 'com.example'
version = '0.0.1-SNAPSHOT'
// Spring Boot 3.x는 최소 Java 17을 요구하므로 sourceCompatibility를 17로 업데이트합니다.
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 기본 스타터 의존성
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-acl'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Webjars 및 기타 프론트엔드 관련 의존성
    implementation 'org.webjars:bootstrap:5.2.3'
    implementation 'org.webjars:sockjs-client:1.5.1'
    implementation 'org.webjars:stomp-websocket:2.3.4'
    implementation 'org.jetbrains:annotations:24.0.1'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'

    // Log4j2 (필요에 따라 최신 버전으로 교체 고려)
    implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.17.1'

    // Querydsl 관련 의존성 (Jakarta)
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // JWT (중복 제거)
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.5'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.5'

    // Lombok 및 Spring Boot Configuration Processor
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    // 기타 의존성
    developmentOnly("org.springframework.boot:spring-boot-devtools")
    runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'org.modelmapper:modelmapper:3.1.1'
    implementation 'org.apache.poi:poi-ooxml:5.2.2'

    // 테스트 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.2'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

